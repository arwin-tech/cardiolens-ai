name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest backend -v

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds and serves predictions
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t cardiolens-api backend
      - name: Start container
        run: docker run -d --name api -p 8000:8000 cardiolens-api
      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Smoke-test a prediction
        run: |
          curl -fsS -X POST http://localhost:8000/api/predict \
            -H "Content-Type: application/json" \
            -d '{"age":53,"gender":2,"height":176,"weight":84,"ap_hi":135,"ap_lo":85,"cholesterol":1,"gluc":1,"smoke":1,"alco":0,"active":1}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r); assert r['risk_category'] == 'Moderate'"
      - name: Show image size
        run: docker image ls cardiolens-api
